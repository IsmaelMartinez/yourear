version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
    groups:
      # vitest and its @vitest/* plugins are co-versioned: coverage-v8 5.x
      # declares a peer on vitest 5.x, so a major bump of one without the
      # other fails npm ci with ERESOLVE (#80, #81).
      vitest:
        patterns:
          - "vitest"
          - "@vitest/*"
      npm-patch-and-minor:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
    groups:
      github-actions-patch-and-minor:
        update-types:
          - "minor"
          - "patch"
